[package]
name = "signal-kit"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
autobenches = false
description = "Helpers for initializing OpenTelemetry-based observability (tracing, metrics, logs) in async Rust services."
license = "MIT OR Apache-2.0"
repository = "https://github.com/liamwh/signal-kit"
homepage = "https://github.com/liamwh/signal-kit"
keywords = ["opentelemetry", "tracing", "metrics", "logging"]
categories = ["development-tools::debugging", "asynchronous"]

[dependencies]
heck = { workspace = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-otlp = { workspace = true, default-features = false, features = ["tokio"] }
opentelemetry-semantic-conventions = { workspace = true }
parking_lot = { workspace = true }
sysinfo = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }
tower = { workspace = true, optional = true }
tracing = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-appender = { workspace = true, optional = true }
tracing-core = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
tracing-error = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["traces", "metrics", "fmt", "grpc-tonic", "tls-roots"]
traces = ["opentelemetry/trace", "opentelemetry_sdk/trace", "opentelemetry-otlp/trace"]
metrics = [
    "opentelemetry/metrics",
    "opentelemetry_sdk/metrics",
    "opentelemetry-otlp/metrics",
]
fmt = ["tracing-subscriber/fmt"]
json = ["tracing-subscriber/json"]
logs-otlp = ["opentelemetry/logs", "opentelemetry_sdk/logs", "opentelemetry-otlp/logs"]
file-logging = ["dep:tracing-appender"]
system = ["dep:sysinfo"]
process = ["dep:sysinfo"]
http = ["dep:tower", "dep:http", "dep:http-body"]
grpc-tonic = ["opentelemetry-otlp/grpc-tonic"]
http-proto = ["opentelemetry-otlp/http-proto"]
http-json = ["opentelemetry-otlp/http-json"]
# HTTP transports need an HTTP client; each passthrough picks one provided by
# opentelemetry-otlp so consumers never inherit an unwanted TLS stack.
reqwest-client = ["opentelemetry-otlp/reqwest-client"]
reqwest-blocking-client = ["opentelemetry-otlp/reqwest-blocking-client"]
reqwest-rustls-webpki-roots = ["opentelemetry-otlp/reqwest-rustls-webpki-roots"]
hyper-client = ["opentelemetry-otlp/hyper-client"]
tls = ["opentelemetry-otlp/tls"]
tls-roots = ["opentelemetry-otlp/tls-roots"]
tls-webpki-roots = ["opentelemetry-otlp/tls-webpki-roots"]

[dev-dependencies]
axum = { workspace = true }
test-log = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true}
opentelemetry-proto = { version = "~0.31", features = ["trace", "gen-tonic-messages"] }
prost = "0.14"
serde_json = { workspace = true }

[lints]
workspace = true
